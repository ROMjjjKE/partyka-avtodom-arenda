ok">Бронь</a></nav><a class="btn" href="tel:+375259688815" style="padding:10px 16px;font-size:13.5px">+375 25 968-88-15</a></div></header><main><section class="hero wrap"><div class="hgrid"><div><span class="kick">6 спальных мест · категория B · любой срок</span><h1>Отель, который едет <em>туда, куда вы</em></h1><p>Полноценный автодом: душ, туалет, кухня с духовкой и холодильником, 220 вольт и тёплая вода. Шесть взрослых спальных мест, шесть сидячих с ремнями безопасности. Права категории B — и Нарочь, море или Карпаты ваши.</p><div class="hacts"><a class="btn" href="#book">Забронировать даты</a><a class="btn ghost" href="#trip">Собрать поездку</a></div><div class="hf"><span><b>6+6</b><small>спальных и сидячих мест</small></span><span><b>B</b><small>обычные права</small></span><span><b>4</b><small>велосипеда на багажнике</small></span></div></div><div class="hero3d" id="hero3d"><div class="ph" id="heroTilt"><img src="assets/hero.jpg" alt="Автодом на берегу озера в сосновом лесу (иллюстративное изображение)"><div class="cap">Иллюстративное изображение: ваш дом на колёсах в любой точке Беларуси</div></div><div class="badge3d">3D · двигайте курсором</div></div></div></section><section class="blk tint" id="trip"><div class="wrap"><div class="k2 fx">конфигуратор</div><h2 class="fx">Соберите поездку — увидите её сразу</h2><p class="lead fx">Выберите направление и срок: сцена подстроится, а под ней — что важно знать про ваш маршрут.</p><div class="trip fx"><div class="scene"><div class="sky" id="sky"></div><svg viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice"><g id="scFar" opacity=".35"><path d="M0 150 Q120 70 240 140 T520 130 T800 145 V220 H0 Z" fill="#35654C"/></g><g id="scMid"><path d="M0 175 C180 120 300 165 460 150 S700 160 800 150 V220 H0 Z" fill="#274C39"/></g><g id="scRoad"><rect x="0" y="188" width="800" height="32" fill="#20261F"/><line x1="0" y1="204" x2="800" y2="204" stroke="#F6F1E7" stroke-width="3" stroke-dasharray="18 14"/><g id="scVan"><rect x="560" y="168" rx="8" width="120" height="40" fill="#F6F1E7" stroke="#20261F" stroke-width="2"/><rect x="700" y="176" rx="6" width="26" height="32" fill="#35654C"/><circle cx="590" cy="210" r="10" fill="#20261F"/><circle cx="650" cy="210" r="10" fill="#20261F"/></g></g></svg></div><div class="ctrl"><div class="tcol"><div class="lbl">Направление</div><div class="dests" id="dests"><button class="on" data-d="naroch">Нарочь</button><button data-d="sea">Море</button><button data-d="forest">Лес и грибы</button></div></div><div class="tcol"><div class="lbl">Срок — <span class="days-val" id="daysVal">5 дней</span></div><input type="range" id="daysR" min="1" max="30" value="5" aria-label="Срок аренды в днях"></div><div class="tcol"><div class="lbl" id="tripOut">Готовим план…</div><div style="font-size:13px;color:var(--mut);line-height:1.55;margin-top:8px" id="tripNote">Нарочь: 240 км от Минска, стоянки у воды. Спальных мест хватает с запасом.</div></div></div></div></div></section><section class="blk" id="plan"><div class="wrap"><div class="k2 fx">внутри</div><h2 class="fx">Планировка: кликайте по зонам</h2><p class="lead fx">Это не «палатка на колёсах», а полноценная квартира в 7 метрах. Нажмите на зону плана — расскажу подробнее.</p><div class="plan fx"><div class="st"><svg viewBox="0 0 760 260" id="planSvg"><rect x="10" y="10" width="740" height="240" rx="14" fill="none" stroke="#35654C" stroke-width="2.5"/><g class="pzone" data-z="cab" style="cursor:pointer"><rect x="20" y="20" width="110" height="70" rx="8" fill="#E3DCCB"/><text x="75" y="60" text-anchor="middle" font-size="11" fill="#20261F">Кабина · 2 места</text></g><g class="pzone" data-z="kitchen" style="cursor:pointer"><rect x="20" y="100" width="110" height="145" rx="8" fill="#E3DCCB"/><text x="75" y="170" text-anchor="middle" font-size="11" fill="#20261F">Кухня</text></g><g class="pzone" data-z="salon" style="cursor:pointer"><rect x="140" y="20" width="240" height="120" rx="8" fill="#E3DCCB"/><text x="260" y="85" text-anchor="middle" font-size="11" fill="#20261F">Салон · 4 места с ремнями</text></g><g class="pzone" data-z="bath" style="cursor:pointer"><rect x="140" y="150" width="110" height="95" rx="8" fill="#E3DCCB"/><text x="195" y="200" text-anchor="middle" font-size="11" fill="#20261F">Душ и туалет</text></g><g class="pzone" data-z="sleep1" style="cursor:pointer"><rect x="390" y="20" width="180" height="70" rx="8" fill="#E3DCCB"/><text x="480" y="60" text-anchor="middle" font-size="11" fill="#20261F">Спальня · 4 места</text></g><g class="pzone" data-z="sleep2" style="cursor:pointer"><rect x="580" y="20" width="160" height="70" rx="8" fill="#E3DCCB"/><text x="660" y="60" text-anchor="middle" font-size="11" fill="#20261F">Спальня · 2 места</text></g><g class="pzone" data-z="bag" style="cursor:pointer"><rect x="390" y="100" width="350" height="145" rx="8" fill="#E3DCCB"/><text x="565" y="175" text-anchor="middle" font-size="11" fill="#20261F">Большой багажник + вход</text></g></svg></div><div class="side"><div class="pz" id="pz"><div class="tagz">Зона</div><h3>Выберите зону на плане</h3><p>Кухня, душ, спальни, салон, багажник — всё настоящее, взрослое и полноценное. Нажмите на любую.</p></div></div></div></div></section><section class="blk tint" id="equip"><div class="wrap"><div class="k2 fx">комплектация</div><h2 class="fx">Укомплектован всем — берите только вещи</h2><p class="lead fx">Из объявления владельца, без сокращений: это то, что уже стоит внутри и работает.</p><div class="equip fx"><div class="eq"><b>Газ</b><span>плита и отопление</span></div><div class="eq"><b>Вода и тепло</b><span>горячая в душе и на кухне</span></div><div class="eq"><b>220 В</b><span>розетки как дома</span></div><div class="eq"><b>Телевизор</b><span>вечера с фильмом</span></div><div class="eq"><b>Холодильник + морозильник</b><span>запас еды на неделю</span></div><div class="eq"><b>Духовой шкаф</b><span>полноценная выпечка</span></div><div class="eq"><b>Просторный душ</b><span>и просторный туалет</span></div><div class="eq"><b>Велобагажник</b><span>на 4 велосипеда</span></div></div></div></section><section class="blk dark" id="day"><div class="wrap"><div class="k2 fx">день в автодоме</div><h2 class="fx">Маршрут, который вы соберёте сами</h2><div class="day fx" style="margin-top:26px"><div class="way"><i id="wayI"></i></div><div class="stop"><div class="t">07:30</div><div><h3>Кофе у воды</h3><p>Просыпаетесь там, где вчера нашли место. Духовка, газ, горячая вода — завтрак как дома, вид — как из отпуска.</p></div></div><div class="stop"><div class="t">10:00</div><div><h3>Погрузка и путь</h3><p>Шесть сидячих мест с ремнями. Велосипеды на багажнике, вещи в большом багажнике — ничего не катается по салону.</p></div></div><div class="stop"><div class="t">14:00</div><div><h3>Остановка там, где понравилось</h3><p>Рядом озеро или лес — fridge уже остудил арбуз. Категория B: обычные права, никакой спецподготовки.</p></div></div><div class="stop"><div class="t">21:00</div><div><h3>Вечер без отеля</h3><p>Тёплая вода в душе, телевизор, шесть спальных мест. Завтра — новое направление: срок и маршрут любые.</p></div></div></div><div class="kmbar fx"><span class="km" id="kmN">0</span><span style="color:#9BC4AD">км по выбору сердца — от Нарочи до моря. Считайте вместе с нами.</span></div></div></section><section class="blk tint" id="book"><div class="wrap"><div class="k2 fx" style="text-align:center">бронирование</div><h2 class="fx" style="text-align:center">Назовите даты — остальные детали по звонку</h2><div class="bkform fx"><form id="bkf" novalidate><input class="bigf" id="bk-name" placeholder="Ваше имя" aria-label="Имя"><input class="bigf" id="bk-dates" placeholder="Даты поездки, например 12–19 июля" aria-label="Даты"><input class="bigf" id="bk-tel" placeholder="+375 __ ___-__-__" inputmode="tel" aria-label="Телефон"><button class="btn" type="submit" style="width:100%;justify-content:center;font-size:16px;margin-top:10px">Отправить заявку на аренду</button><div class="o
